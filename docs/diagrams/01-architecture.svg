<svg xmlns="http://www.w3.org/2000/svg" width="1248" height="940" viewBox="16 0 1248 940" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs>
<rect x="16" y="0" width="1248" height="940" fill="#fcfbf7"/>
<text x="40" y="50.6" font-size="28" fill="#1f2937" text-anchor="start" xml:space="preserve">Nexus Agent — Control-Plane / Data-Plane Architecture</text>
<text x="40" y="80.2" font-size="15" fill="#5b6472" text-anchor="start" xml:space="preserve">One kernel behind every surface; the data plane is a configuration flag away from a customer VPC.</text>
<rect x="40" y="110" width="1200" height="124" rx="31" fill="#eef6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="56" y="135.3" font-size="14" fill="#1d4ed8" text-anchor="start" xml:space="preserve">Surface adapters — thin, translate I/O only (no control-flow fork) · nine classes; agent-to-agent ingress is its own admission class, off by default</text>
