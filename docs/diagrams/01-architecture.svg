<text x="254" y="577.4" font-size="12" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">Orchestration plane — declarative plans</text>
<text x="254" y="592.4" font-size="12" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">steps · conditions · gates · fan-out</text>
<text x="254" y="607.4" font-size="12" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">routing costs zero model tokens</text>
