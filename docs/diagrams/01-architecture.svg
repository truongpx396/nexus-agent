<text x="640" y="307.2" font-size="15" fill="#0f766e" text-anchor="middle" xml:space="preserve">Control plane (Go): AuthN (SSO/OIDC, per-tenant issuer) · RBAC · per-tenant rate limits</text>
<text x="640" y="326.0" font-size="15" fill="#0f766e" text-anchor="middle" xml:space="preserve">budget check (pre-spend reservation) · deterministic routing by data label + difficulty</text>
