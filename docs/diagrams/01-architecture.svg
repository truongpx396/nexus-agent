<text x="656" y="377.4" font-size="12" fill="#5b6472" text-anchor="start" xml:space="preserve">versioned contract — moving the data plane is a deployment flag, not a rewrite</text>
<rect x="40" y="396" width="1200" height="266" rx="32" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
<text x="56" y="422.2" font-size="15" fill="#0f766e" text-anchor="start" xml:space="preserve">Data plane (Go) — deployable into a customer VPC (BYOC) unchanged</text>
