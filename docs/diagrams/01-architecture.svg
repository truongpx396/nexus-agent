<text x="640" y="577.4" font-size="12" fill="#1f2937" text-anchor="middle" xml:space="preserve">Connector / MCP catalog — vetted, per-tenant</text>
<text x="640" y="592.4" font-size="12" fill="#1f2937" text-anchor="middle" xml:space="preserve">RBAC-scoped · audience-restricted tokens</text>
<text x="640" y="607.4" font-size="12" fill="#1f2937" text-anchor="middle" xml:space="preserve">descriptors injection-scanned at admission</text>
<rect x="840" y="546" width="370" height="86" rx="22" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<text x="1026" y="577.4" font-size="12" fill="#b45309" text-anchor="middle" xml:space="preserve">Oversight — approval + input requests</text>
<text x="1026" y="592.4" font-size="12" fill="#b45309" text-anchor="middle" xml:space="preserve">digest-bound · durable suspend</text>
<text x="1026" y="607.4" font-size="12" fill="#b45309" text-anchor="middle" xml:space="preserve">zero token cost while waiting</text>
