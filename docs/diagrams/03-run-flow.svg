<svg xmlns="http://www.w3.org/2000/svg" width="1179" height="566" viewBox="16 0 1179 566" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs>
<rect x="16" y="0" width="1179" height="566" fill="#fcfbf7"/>
<text x="40" y="50.6" font-size="28" fill="#1f2937" text-anchor="start" xml:space="preserve">Nexus Agent — Run Lifecycle / Request Flow</text>
<text x="40" y="80.2" font-size="15" fill="#5b6472" text-anchor="start" xml:space="preserve">A run is queued, executed by a stateless worker, streamed as structure-only events, may suspend for a human, and ends in a typed terminal reason.</text>
<rect x="60" y="140" width="180" height="76" rx="19" fill="#eef6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="150" y="174.3" font-size="13" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">POST /v1/runs</text>
<text x="150" y="190.6" font-size="13" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">202 accepted</text>
<rect x="290" y="140" width="180" height="76" rx="19" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<text x="380" y="174.3" font-size="13" fill="#b45309" text-anchor="middle" xml:space="preserve">Durable queue</text>
<text x="380" y="190.6" font-size="13" fill="#b45309" text-anchor="middle" xml:space="preserve">session-key serial lock</text>
<rect x="514" y="140" width="197" height="76" rx="19" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
<text x="612" y="174.3" font-size="13" fill="#1f2937" text-anchor="middle" xml:space="preserve">Runtime worker</text>
<text x="612" y="190.6" font-size="13" fill="#1f2937" text-anchor="middle" xml:space="preserve">loads session · checkpoints</text>
<rect x="750" y="140" width="180" height="76" rx="19" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
<text x="840" y="174.3" font-size="13" fill="#0f766e" text-anchor="middle" xml:space="preserve">Kernel loop</text>
<text x="840" y="190.6" font-size="13" fill="#0f766e" text-anchor="middle" xml:space="preserve">observe → think → act</text>
<rect x="980" y="140" width="190" height="76" rx="19" fill="#eef6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="1074" y="174.3" font-size="13" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">Stream events</text>
<text x="1074" y="190.6" font-size="13" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">structure-only (SSE)</text>
<polyline points="240,178 290,178" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="470,178 514,178" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="711,178 750,178" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="930,178 980,178" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#ah)"/>
<rect x="60" y="270" width="180" height="100" rx="25" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<text x="150" y="309.4" font-size="12" fill="#b45309" text-anchor="middle" xml:space="preserve">Early rejection</text>
<text x="150" y="324.4" font-size="12" fill="#b45309" text-anchor="middle" xml:space="preserve">401 unauth · 402 budget</text>
<text x="150" y="339.4" font-size="12" fill="#b45309" text-anchor="middle" xml:space="preserve">403 RBAC · 429 + Retry-After</text>
<rect x="290" y="270" width="180" height="100" rx="25" fill="#f8fafc" stroke="#5b6472" stroke-width="2"/>
<text x="380" y="309.4" font-size="12" fill="#5b6472" text-anchor="middle" xml:space="preserve">Control ops on a live run</text>
<text x="380" y="324.4" font-size="12" fill="#5b6472" text-anchor="middle" xml:space="preserve">cancel · steer</text>
<text x="380" y="339.4" font-size="12" fill="#5b6472" text-anchor="middle" xml:space="preserve">resume · fork</text>
<rect x="700" y="270" width="180" height="100" rx="25" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<text x="790" y="309.4" font-size="12" fill="#b45309" text-anchor="middle" xml:space="preserve">Suspended</text>
<text x="790" y="324.4" font-size="12" fill="#b45309" text-anchor="middle" xml:space="preserve">approval / input request</text>
<text x="790" y="339.4" font-size="12" fill="#b45309" text-anchor="middle" xml:space="preserve">zero ongoing token cost</text>
<rect x="980" y="270" width="190" height="100" rx="25" fill="#eef6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="1075" y="309.4" font-size="12" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">Durable outbox</text>
<text x="1075" y="324.4" font-size="12" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">reply · approval · reminder</text>
<text x="1075" y="339.4" font-size="12" fill="#1d4ed8" text-anchor="middle" xml:space="preserve">event appended before send</text>
<polyline points="150,216 150,270" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="770,216 770,270" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="820,270 820,216" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#ah)"/>
<text x="828" y="242.4" font-size="11" fill="#0f766e" text-anchor="start" xml:space="preserve">resume</text>
<polyline points="1075,216 1075,270" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah)"/>
<text x="60" y="423.4" font-size="12" fill="#5b6472" text-anchor="start" xml:space="preserve">Checkpointed per turn — a killed worker resumes from the last checkpoint,</text>
<text x="60" y="438.4" font-size="12" fill="#5b6472" text-anchor="start" xml:space="preserve">never from scratch. An in-flight external effect carries a write-ahead claim</text>
<text x="60" y="453.4" font-size="12" fill="#5b6472" text-anchor="start" xml:space="preserve">resolved on resume by probe or by a human decision — never by re-execution,</text>
<text x="60" y="468.4" font-size="12" fill="#5b6472" text-anchor="start" xml:space="preserve">never by silent discard.</text>
<rect x="700" y="410" width="470" height="132" rx="32" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
<text x="936" y="454.3" font-size="14" fill="#0f766e" text-anchor="middle" xml:space="preserve">Terminal reason</text>
<text x="936" y="471.8" font-size="14" fill="#0f766e" text-anchor="middle" xml:space="preserve">completed · max_turns · cost_exhausted · error</text>
<text x="936" y="489.3" font-size="14" fill="#0f766e" text-anchor="middle" xml:space="preserve">aborted · prompt_too_long · hook_stopped</text>
<text x="936" y="506.8" font-size="14" fill="#0f766e" text-anchor="middle" xml:space="preserve">approval_expired · input_expired</text>
<polyline points="910,216 910,410" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#ah)"/>
<polyline points="770,370 770,410" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#ah)"/>
<text x="640" y="394.4" font-size="11" fill="#b45309" text-anchor="start" xml:space="preserve">expired → denial</text>
</svg>
