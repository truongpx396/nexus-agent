[project]
name = "ml-python"
version = "0.0.1"
description = "ML/eval helper package for the Nexus Agent platform (bootstrap scaffold)."
readme = "README.md"
requires-python = ">=3.13.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_python"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
