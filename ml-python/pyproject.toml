[project]
name = "nexus-ml-python"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
