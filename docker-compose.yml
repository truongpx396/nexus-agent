name: nexus-agent

# Local dev / CI backing services ONLY — never a deployment artifact.
# Brings up Postgres + Redis for local development, per
# specs/001-agent-platform/quickstart.md ("docker compose up -d postgres redis").
#
# Credentials are REQUIRED via a local .env (never committed, never
# defaulted to a guessable value) — see .env.example for every variable this
# file references. Published ports are bound to 127.0.0.1 only.
#
# NOTE on depends_on/service_healthy: postgres and redis are independent
# backing services with no dependency on each other, so there is nothing in
# THIS file to gate on a healthcheck yet. When an app-tier service (e.g.
# control-plane, runtime-worker) is added to this compose file in a later
# phase, it MUST declare `depends_on: { postgres: { condition: service_healthy },
# redis: { condition: service_healthy } }` rather than starting against a
# not-yet-ready backing service.

services:
  postgres:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env — see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env — see .env.example}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env — see .env.example}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
