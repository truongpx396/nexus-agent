name: Deploy · Staging

# On every push to main: build the deployable images, push them to Docker Hub
# (tagged with the commit sha + `staging`), then roll the staging droplet forward
# via SSH + docker compose. A failed health gate triggers an automatic rollback
# to the previously-running tag inside scripts/deploy.sh.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
  ENVIRONMENT: staging

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        shell: bash
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build each deployable component if its Dockerfile exists. Spec-stage
      # checkouts have no build context yet, so this no-ops until code lands.
      - name: Build & push images
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          NS="${IMAGE_NAMESPACE}"
          declare -A images=(
            ["nexus-control"]="deploy/mini/Dockerfile"
            ["nexus-ml-python"]="deploy/mini/Dockerfile.ml-python"
          )
          any=0
          for name in "${!images[@]}"; do
            df="${images[$name]}"
            if [[ ! -f "$df" ]]; then
              echo "::notice::$df not present yet — skipping $name."
              continue
            fi
            any=1
            docker buildx build \
              --file "$df" \
              --tag "${REGISTRY}/${NS}/${name}:${TAG}" \
              --tag "${REGISTRY}/${NS}/${name}:${ENVIRONMENT}" \
              --cache-from "type=registry,ref=${REGISTRY}/${NS}/${name}:buildcache" \
              --cache-to "type=registry,ref=${REGISTRY}/${NS}/${name}:buildcache,mode=max" \
              --push \
              .
          done
          if [[ "$any" == "0" ]]; then
            echo "::warning::No Dockerfiles present — nothing pushed. Deploy will be skipped."
          fi

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/telegram-notify
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: started
          title: "Deploy to staging"
          environment: staging
          message: "Rolling staging to ${{ needs.build-push.outputs.tag }}."

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'deploy' }}
          IMAGE_TAG: ${{ needs.build-push.outputs.tag }}
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
        run: ./scripts/deploy.sh do staging

      - name: Notify success
        if: success()
        uses: ./.github/actions/telegram-notify
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: success
          title: "Deploy to staging succeeded"
          environment: staging
          message: "Now running ${{ needs.build-push.outputs.tag }}."

      - name: Notify failure
        if: failure()
        uses: ./.github/actions/telegram-notify
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: failure
          title: "Deploy to staging FAILED"
          environment: staging
          message: "Automatic rollback attempted. Check the run logs."
