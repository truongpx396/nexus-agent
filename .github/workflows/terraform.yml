name: Terraform

# Plan on any PR touching infra/terraform/**, and apply on push to main (gated by
# the `infra` GitHub Environment reviewer). State lives in DigitalOcean Spaces via
# the S3-compatible backend, so plans/applies are serialized by native locking.

on:
  push:
    branches: [main]
    paths: ["infra/terraform/**"]
  pull_request:
    paths: ["infra/terraform/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to apply.
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  # DigitalOcean Spaces S3-compatible backend credentials.
  AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
  # DO provider token.
  DIGITALOCEAN_TOKEN: ${{ secrets.DO_API_TOKEN }}
  TF_VERSION: "1.10.5"
  TF_ROOT: infra/terraform/do

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging, production]
    defaults:
      run:
        working-directory: ${{ env.TF_ROOT }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend-config="key=nexus/${{ matrix.environment }}/terraform.tfstate"

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        run: |
          terraform plan -no-color -input=false \
            -var-file="environments/${{ matrix.environment }}.tfvars" \
            -out="tfplan-${{ matrix.environment }}" | tee plan.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_ROOT }}/plan.txt', 'utf8');
            const body = `#### Terraform Plan — \`${{ matrix.environment }}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan.slice(0, 60000)}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  apply:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: plan
    runs-on: ubuntu-latest
    environment: infra
    defaults:
      run:
        working-directory: ${{ env.TF_ROOT }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: terraform init -backend-config="key=nexus/${{ github.event.inputs.environment || 'staging' }}/terraform.tfstate"

      - name: Apply
        run: |
          terraform apply -auto-approve -input=false \
            -var-file="environments/${{ github.event.inputs.environment || 'staging' }}.tfvars"

      - name: Notify
        if: always()
        uses: ./.github/actions/telegram-notify
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: ${{ job.status == 'success' && 'success' || 'failure' }}
          title: "Terraform apply (${{ github.event.inputs.environment || 'staging' }})"
          environment: infra
