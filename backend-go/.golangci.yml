version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - govet
    - errcheck
    # staticcheck (with checks: all below) also subsumes the old "gosimple"
    # (S1xxx) and "stylecheck" (ST1xxx) linters, which golangci-lint v2 no
    # longer exposes as standalone linters.
    - staticcheck
    - unused
    - ineffassign

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    staticcheck:
      checks:
        - all

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
